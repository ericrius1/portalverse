name: Room checks
on: [pull_request, push]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@8.15.9 install --frozen-lockfile
      - run: npm run build
      - run: npm test
